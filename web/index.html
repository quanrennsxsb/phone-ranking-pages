<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>性能排行 · 手机资料库</title>
  <link rel="stylesheet" href="styles.css?v=20261017b">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark"><span class="brand-dot"></span><span>性能排行</span></div>
      <label class="search-box"><span class="search-icon">⌕</span><input id="searchInput" placeholder="搜索机型、品牌、处理器"><kbd>/</kbd></label>
      <button class="icon-btn search-btn" id="searchBtn" aria-label="搜索">⌕</button>
      <div class="top-meta"><span class="live-dot"></span><span id="syncMeta">数据同步中…</span></div>
      <div class="nav-menu" id="navMenu">
        <button class="icon-btn nav-toggle" id="navToggle" aria-label="菜单" aria-expanded="false">☰</button>
        <div class="nav-dropdown" id="navDropdown" role="menu">
          <button class="nav-dropdown-item active" data-view="updates" role="menuitem">更新动态</button>
          <button class="nav-dropdown-item" data-view="favorites" role="menuitem">我的收藏</button>
          <button class="nav-dropdown-item" data-view="rankings" role="menuitem">处理器排行</button>
          <button class="nav-dropdown-item" data-view="brands" role="menuitem">手机品牌</button>
        </div>
      </div>
      <button class="icon-btn theme-btn" id="themeBtn" aria-label="切换深浅色">☀</button>
    </header>

    <aside class="settings-panel" id="settingsPanel">
      <h3>同步设置</h3>
      <p class="settings-status" id="syncStatus">同步状态读取中…</p>
      <label class="settings-row">同步间隔（小时）
        <input id="intervalInput" type="number" min="1" step="1" value="24">
      </label>
      <div class="settings-actions">
        <button class="outline-btn" id="saveIntervalBtn">保存间隔</button>
        <button class="ghost-btn" id="settingsClose">关闭</button>
      </div>
      <p class="settings-status" id="settingsStatus"></p>
    </aside>

    <main id="mainContent">
      <section class="page-view active" id="updatesView">
        <div class="hero-strip">
          <div><span class="eyebrow">TODAY'S RELEASES</span><h1>新机动态</h1><p>最近更新 <b id="updatesCount">0</b> 条 · 数据来自官方接口实时同步。</p></div>
          <div class="hero-actions">
            <button class="outline-btn" id="refreshBtn">刷新显示</button>
          </div>
        </div>
        <div class="phone-list" id="updatesList"></div>
      </section>

      <section class="page-view" id="favoritesView">
        <div class="hero-strip compact">
          <div><span class="eyebrow">SAVED DEVICES</span><h1>我的收藏</h1><p>共 <b id="favoritesCount">0</b> 款机型 · 仅保存在当前浏览器。</p></div>
        </div>
        <div class="phone-list" id="favoritesList"></div>
      </section>

      <section class="page-view" id="catalogView">
        <div class="hero-strip compact">
          <div><span class="eyebrow">SEARCH RESULTS</span><h1>搜索结果</h1><p>共 <b id="catalogCount">0</b> 款机型，点击查看完整参数。</p></div>
          <label class="search-box catalog-search"><span class="search-icon">⌕</span><input id="catalogSearch" placeholder="在当前结果中筛选"></label>
        </div>
        <div class="catalog-toolbar">
          <span class="search-hint" id="catalogHint">支持「苹果14」「红米 K100」这类写法</span>
          <label class="search-hint">排序
            <select class="sort-select" id="sortSelect">
              <option value="update">更新时间</option>
              <option value="sale">发售日期</option>
              <option value="score">性能总分</option>
              <option value="priceAsc">价格从低到高</option>
              <option value="priceDesc">价格从高到低</option>
            </select>
          </label>
        </div>
        <div class="phone-list" id="catalogList"></div>
        <div class="pager">
          <button class="outline-btn" id="prevPageBtn">上一页</button>
          <span class="muted" id="pagerInfo"></span>
          <button class="outline-btn" id="nextPageBtn">下一页</button>
        </div>
      </section>

      <section class="page-view" id="brandsView">
        <div class="hero-strip compact"><div><span class="eyebrow">MANUFACTURERS</span><h1>手机品牌</h1><p>按品牌浏览机型资料。</p></div><span class="count-label" id="brandCountLabel">0 个品牌</span></div>
        <div class="brand-grid" id="brandGrid"></div>
      </section>

      <section class="page-view" id="rankingsView">
        <div class="hero-strip compact"><div><span class="eyebrow">BENCHMARK INDEX</span><h1>处理器排行</h1><p>按 Geekbench 6 多核成绩排序。</p></div><span class="count-label" id="rankCountLabel">0 款</span></div>
        <div class="table-wrap"><div class="table-head"><span>处理器</span><span>单核</span><span>多核</span><span>参考机型</span><span>综合</span></div><div id="rankingRows"></div></div>
      </section>

      <section class="page-view detail-view" id="detailView" aria-live="polite"></section>
    </main>

  </div>
  <script src="app.js?v=20261017c"></script>
</body>
</html>
